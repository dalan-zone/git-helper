# =============================================================================
# release.yml  —  Entry point for THIS repo (git-helper)
# -----------------------------------------------------------------------------
# It only decides *when* to release (tag push / manual run) and delegates the
# actual build + sign + publish to the shared, reusable workflow:
#   .github/workflows/android-release.yml
#
# Other projects copy this file and change the `uses:` line to point at the
# shared workflow, e.g.:
#   uses: dalan-zone/git-helper/.github/workflows/android-release.yml@main
# (see BRANCHING.md for the full template + required secrets)
# =============================================================================

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName (SemVer), e.g. 1.2.0'
        required: true
        default: '1.0.0'

jobs:
  release:
    uses: ./.github/workflows/android-release.yml
    secrets: inherit
    with:
      version-name: >-
        ${{ github.ref_type == 'tag' && substring(github.ref_name, 1)
            || inputs.versionName }}
