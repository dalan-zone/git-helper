name: Release

# Triggers:
#   - push a tag like v1.2.0  -> versionName taken from the tag, versionCode auto-bumped
#   - manual run              -> supply VERSION_NAME; versionCode auto-bumped
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName (SemVer), e.g. 1.2.0'
        required: true
        default: '1.0.0'

permissions:
  contents: write   # needed to commit the bumped versionCode back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for commit count)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bump versionCode
        id: bump
        run: |
          CODE=$(grep -E '^VERSION_CODE=' version.properties | cut -d= -f2)
          CODE=$((CODE + 1))
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=$CODE/" version.properties
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Resolve versionName
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=${{ github.event.inputs.versionName }}" >> "$GITHUB_ENV"
          fi

      - name: Sync versionName into gradle.properties
        run: |
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${VERSION_NAME}/" gradle.properties

      # --- Optional: restore signing keystore from a base64 secret ---
      # Store KEYSTORE_BASE64 in repo secrets, then uncomment:
      # - name: Decode signing keystore
      #   run: |
      #     echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
      #     echo "KEYSTORE_FILE=$PWD/app/release.keystore" >> "$GITHUB_ENV"
      #     echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
      #     echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
      #     echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release AAB (prod flavor)
        run: ./gradlew :app:bundleProdRelease -PVERSION_NAME="${VERSION_NAME}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release-aab
          path: app/build/outputs/bundle/prodRelease/*.aab

      - name: Build release APK (prod flavor)
        run: ./gradlew :app:assembleProdRelease -PVERSION_NAME="${VERSION_NAME}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release-apk
          path: app/build/outputs/apk/prodRelease/*.apk

      # --- Optional: publish to Google Play internal track ---
      # Needs PLAY_SERVICE_ACCOUNT_JSON in secrets.
      # - name: Publish to Play Store
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.example.app
      #     releaseFiles: app/build/outputs/bundle/prodRelease/*.aab
      #     track: internal
      #     status: completed

      - name: Commit bumped versionCode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties gradle.properties
          git commit -m "ci: bump versionCode to ${{ steps.bump.outputs.code }} [skip ci]" || echo "nothing to commit"
          git push
