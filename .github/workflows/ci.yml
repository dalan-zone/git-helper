# =============================================================================
# ci.yml  —  PR / main 校验（与发布流水线 release.yml 分离）
# -----------------------------------------------------------------------------
# 作用：在 PR 和推送到 main 时跑 lint + 单元测试 + 一次 debug 构建冒烟，
#       让 "合并前 CI 必须通过" 有东西可卡。
# 注意：发布（打 tag）由 release.yml 负责，这里不做签名/打包。
# 发布工作流回写的提交带 [skip ci]，会自动跳过本工作流，不会死循环。
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug (smoke)
        run: ./gradlew :app:assembleDebug
